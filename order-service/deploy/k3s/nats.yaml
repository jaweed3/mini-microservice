apiVersion: v1
kind: Namespace
metadata:
  name: seblak
---
apiVersion: apps/v1
kind: Deployment 
metadata:
  name: nats
  namespace: seblak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
      - name: nats
        image: nats:2.10-alpine
        args: ["-js", "-sd", "/data", "-m", "8222"]
        ports: 
        - containerPort: 4222
        - containerPort: 8222
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service 
metadata:
  name: nats
  namespace: seblak
spec:
  selector:
    app: nats
  ports:
  - name: client
    port: 4222
    targetPort: 4222
  - name: monitor
    port: 8222
    targetPort: 8222
