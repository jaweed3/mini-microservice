apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: order 
  namespace: seblak
spec:
  replicas: 1
  selector: 
    matchLabels: 
      app: order
  template:
    metadata: 
      labels: 
        app: order
    spec:
      containers:
      - name: order
        image: order:local
        imagePullPolicy: IfNotPresent
        ports: 
        - containerPort: 3333
        env:
        - name: NATS_URL
          value: "nats://nats:4222"
        - name: DB_PATH
          value: "/data/orders.db"
        readinessProbe: 
          httpGet: 
            path: /healthz 
            port: 3333 
          periodSeconds: 5
        volumeMounts: 
        - name: data 
          mountPath: /data
      volumes: 
      - name: data
        persistentVolumeClaim:
          claimName: order-data
---
apiVersion: v1
kind: Service 
metadata: 
  name: order 
  namespace: seblak
spec: 
  selector: 
    app: order
  ports: 
  - port: 3333  
    targetPort: 3333
